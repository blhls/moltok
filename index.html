<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOULTLOOK.COM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oxanium:wght@300;400;500;600;700;800&family=Share+Tech+Mono&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-default">

<!-- ═══════════════════════════════════════════
     SCREEN: LOGIN
═══════════════════════════════════════════ -->
<section id="screen-login" class="screen screen-login">

    <canvas id="bg-canvas" class="bg-canvas"></canvas>
    <div class="grain-overlay"></div>

    <div class="login-title-wrap">
        <div class="big-glitch-wrap">
            <h1 class="big-glitch" data-text="MOULTLOOK">MOULTLOOK</h1>
            <span class="big-glitch-dot">.COM</span>
        </div>
        <p class="login-tagline">select your operational theatre</p>
    </div>

    <div class="win-window login-window">
        <div class="win-titlebar">
            <div class="win-btn-group">
                <button class="win-btn win-btn-cls" tabindex="-1"></button>
                <button class="win-btn" tabindex="-1"></button>
                <button class="win-btn" tabindex="-1"></button>
            </div>
            <span class="win-title-text">identification required</span>
        </div>
        <div class="win-body login-body">
            <div class="login-gif-slot">
                <img src="session.gif" alt="" class="login-gif" onerror="this.style.display='none'">
            </div>
            <div class="login-box">
                <button class="main-btn" onclick="startLoading('en')">
                    CHECK MY CRABS<br><small>( international )</small>
                </button>
                <div class="or-divider">// OR //</div>
                <button class="gascony-btn" onclick="startLoading('fr')">
                    CRABE M'A TUER<br><small>( gascogne occupée )</small>
                </button>
            </div>
        </div>
        <div class="win-statusbar">
            <span>READY</span>
            <span>[ ENCRYPTED ]</span>
            <span id="login-clock"></span>
        </div>
    </div>

    <div class="login-character-wrap">
        <img src="character.png" alt="" class="login-character" onerror="this.style.display='none'">
    </div>

</section>


<!-- ═══════════════════════════════════════════
     SCREEN: LOADING
═══════════════════════════════════════════ -->
<section id="screen-loading" class="screen screen-loading" style="display:none;">

    <canvas id="bg-canvas-loading" class="bg-canvas"></canvas>
    <div class="grain-overlay"></div>

    <div class="win-window loading-window">
        <div class="win-titlebar">
            <div class="win-btn-group">
                <button class="win-btn win-btn-cls" tabindex="-1"></button>
                <button class="win-btn" tabindex="-1"></button>
                <button class="win-btn" tabindex="-1"></button>
            </div>
            <span class="win-title-text" id="loading-titlebar-text">system initialisation — moultlook v1.0</span>
        </div>
        <div class="win-body loading-body">
            <div class="loading-gif-slot" id="loading-gif-slot">
                <img src="session.gif" alt="" class="loading-gif" id="loading-gif"
                     onerror="this.parentElement.innerHTML='<span class=\'gif-fallback\'>🦀</span>'">
            </div>
            <h2 id="loading-title" class="loading-title-text">HARDENING...</h2>
            <div class="win-progress-outer">
                <div class="win-progress-inner" id="progress-bar"></div>
            </div>
            <p class="loading-sub" id="loading-sub">loading modules...</p>
        </div>
    </div>

</section>


<!-- ═══════════════════════════════════════════
     SCREEN: APP
═══════════════════════════════════════════ -->
<section id="screen-app" class="screen screen-app" style="display:none;">

    <canvas id="bg-canvas-app" class="bg-canvas"></canvas>
    <div class="grain-overlay"></div>

    <div class="scrolling-banner">
        <div id="banner-text" class="banner-text"></div>
    </div>

    <div class="app-window">

        <div class="app-titlebar win-titlebar">
            <div class="win-btn-group">
                <button class="win-btn win-btn-cls" tabindex="-1"></button>
                <button class="win-btn" tabindex="-1"></button>
                <button class="win-btn" tabindex="-1"></button>
            </div>
            <span class="win-title-text">🦀 &nbsp;<span id="app-win-title">MOULTLOOK</span></span>
        </div>

        <div class="app-menubar">
            <span class="menubar-item">Fichier</span>
            <span class="menubar-item">Édition</span>
            <span class="menubar-item">Affichage</span>
            <span class="menubar-item">Mue</span>
            <span class="menubar-item">?</span>
        </div>

        <div class="app-layout">
            <aside id="sidebar" class="sidebar">
                <div id="sidebar-toggle" class="moult-header">
                    <span class="hamburger">≡</span>
                    <span class="label-full">MOULTLOOK</span>
                    <span class="label-vert">M O U L T L O O K</span>
                </div>
                <nav class="nav-links" id="sidebar-nav"></nav>
                <div class="nav-item moult-btn" onclick="moult()">
                    <span class="icon">🦀</span>
                    <span class="txt">MOULT</span>
                </div>
            </aside>

            <section class="middle-row" id="email-list"></section>
            <main class="content-view" id="content-view"></main>
        </div>

    </div>

    <footer class="mirror-footer">
        <button id="lang-toggle-btn" onclick="toggleLanguage()"></button>
    </footer>

</section>


<script src="data.js"></script>
<script src="script.js"></script>
<script>
    function updateClock() {
        const el = document.getElementById('login-clock');
        if (el) el.innerText = new Date().toLocaleTimeString();
    }
    setInterval(updateClock, 1000);
    updateClock();
</script>
</body>
</html>
