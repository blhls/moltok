<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOULTLOOK OS v9.5</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-default">

    <section id="screen-login" class="screen">
        <div class="os-window login-content">
            <div class="window-title-bar">
                <span>SYSTEM_BOOT.EXE</span>
                <div class="window-controls"><button>X</button></div>
            </div>
            <div class="window-body">
                <h1 class="glitch-text">MOULTLOOK.COM</h1>
                <p class="sys-prompt">C:\> SELECT_EVOLUTION_PATH_</p>
                <div class="login-box">
                    <button class="retro-btn" onclick="startLoading('en')">CHECK MY CRABS<br><small>(International)</small></button>
                    <div class="or-divider">~ OR ~</div>
                    <button class="retro-btn alt-btn" onclick="startLoading('fr')">CRABE M'A TUER<br><small>(Gascogne Occupée)</small></button>
                </div>
            </div>
        </div>
    </section>

    <section id="screen-loading" class="screen" style="display:none;">
        <div class="os-window loader-content">
            <div class="window-title-bar">
                <span>PROCESSING...</span>
            </div>
            <div class="window-body text-center">
                <div class="crab-spinner">🦀</div>
                <h2 id="loading-title" class="blink">Hardening...</h2>
            </div>
        </div>
    </section>

    <section id="screen-app" class="screen app-bg" style="display:none;">
        <div class="scrolling-banner">
            <div id="banner-text" class="banner-text"></div>
        </div>

        <div class="app-layout">
            <aside id="sidebar" class="sidebar win-panel">
                <div id="sidebar-toggle" class="moult-header">
                    <span class="hamburger">≡</span>
                    <span class="label-full">MOULTLOOK</span>
                    <span class="label-vert">M O U L T L O O K</span>
                </div>
                <nav class="nav-links inset-panel" id="sidebar-nav"></nav>
                <div class="nav-item moult-btn retro-btn" onclick="moult()">
                    <span class="icon">⚠️</span> <span class="txt">FORCE MOULT</span>
                </div>
            </aside>

            <section class="middle-row win-panel" id="email-list-wrapper">
                <div class="window-title-bar"><span>INDEX</span></div>
                <div id="email-list" class="inset-panel"></div>
            </section>

            <main class="content-view win-panel" id="content-wrapper">
                <div class="window-title-bar">
                    <span>VIEWER.EXE</span>
                    <div class="window-controls"><button>?</button><button>X</button></div>
                </div>
                <div id="content-view" class="inset-panel bg-grid"></div>
            </main>
        </div>

        <footer class="mirror-footer">
            <button id="lang-toggle-btn" class="retro-btn" onclick="toggleLanguage()"></button>
        </footer>
    </section>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
