<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOULTLOOK.COM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Bungee+Inline&family=Press+Start+2P&family=Nunito:wght@400;600;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="theme-default">

<canvas id="glitter-canvas"></canvas>

<!-- ══════════════════════════════════════
     LOGIN
     ══════════════════════════════════════ -->
<section id="screen-login" class="screen screen-login">

    <h1 class="site-title" data-text="MOULTLOOK.COM">
        MOULTLOOK<span class="title-dot">.COM</span>
    </h1>

    <div class="login-panel">
        <div class="login-panel-inner">

            <div class="dex-top-bar">
                <div class="dex-eye large"></div>
                <p class="login-tagline">SECURE PORTAL &nbsp;·&nbsp; CHITIN REQUIRED</p>
                <div class="dex-lights">
                    <div class="dex-light cherry pulse-slow"></div>
                    <div class="dex-light amber"></div>
                    <div class="dex-light duckegg"></div>
                </div>
            </div>

            <div class="ornament-row">
                <span class="orn-line"></span>
                <span class="orn-text">◆ 🦀 ◆</span>
                <span class="orn-line"></span>
            </div>

            <div class="login-box">
                <button class="aqua-btn btn-main" onclick="startLoading('en')">
                    CHECK MY CRABS
                    <small>(International)</small>
                </button>
                <div class="or-divider">— &nbsp; OR &nbsp; —</div>
                <button class="aqua-btn btn-french" onclick="startLoading('fr')">
                    CRABE M'A TUER
                    <small>(Gascogne Occupée)</small>
                </button>
            </div>

            <p class="press-start blink">▶ SELECT YOUR REALITY ◀</p>
        </div>
    </div>

    <p class="login-footer-tag">v4.0 &nbsp;·&nbsp; 🦀 &nbsp;·&nbsp; moultlook.com &nbsp;·&nbsp; all spooks reserved</p>
</section>

<!-- ══════════════════════════════════════
     LOADING
     ══════════════════════════════════════ -->
<section id="screen-loading" class="screen screen-loading" style="display:none;">
    <div class="loading-panel">
        <div class="loading-panel-inner">
            <div class="crab-spinner">🦀</div>
            <h2 id="loading-title" class="loading-title">Hardening chitin...</h2>
            <div class="hp-row">
                <span class="hp-label">EGO</span>
                <div class="hp-bar-outer">
                    <div class="hp-bar-inner" id="progress-bar"></div>
                </div>
                <span class="hp-label">MAX</span>
            </div>
            <p class="loading-sub" id="loading-sub">Dissolving the social contract...</p>
        </div>
    </div>
</section>

<!-- ══════════════════════════════════════
     APP
     ══════════════════════════════════════ -->
<section id="screen-app" class="screen screen-app" style="display:none;">

    <div class="scrolling-banner">
        <div id="banner-text" class="banner-text"></div>
    </div>

    <div class="app-frame">
        <div class="app-titlebar">
            <div class="titlebar-left">
                <div class="dex-eye small"></div>
                <span id="app-win-title" class="app-title-text glitch-subtle">MOULTLOOK</span>
                <span class="title-cursor blink">█</span>
            </div>
            <div class="titlebar-right">
                <button id="lang-toggle-btn" class="lang-btn" onclick="toggleLanguage()"></button>
            </div>
        </div>

        <div class="app-layout">

            <aside id="sidebar" class="sidebar">
                <div id="sidebar-toggle" class="sidebar-header">
                    <span class="hamburger">≡</span>
                    <span class="label-full glitch-subtle" style="--gd:5">MOULTLOOK</span>
                    <span class="label-vert">M·L·O·K</span>
                </div>
                <nav class="nav-links" id="sidebar-nav"></nav>
                <div class="sidebar-bottom-lights">
                    <div class="dex-light cherry pulse-slow"></div>
                    <div class="dex-light amber"></div>
                    <div class="dex-light duckegg"></div>
                </div>
                <div class="nav-item moult-btn" onclick="moult()">
                    <span class="icon">🦀</span>
                    <span class="txt">MOULT</span>
                </div>
            </aside>

            <section class="middle-row" id="email-list"></section>
            <main class="content-view" id="content-view"></main>

        </div>
    </div>

</section>

<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
