<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MOULTLOOK.COM</title>
  <link rel="stylesheet" href="style.css" />
  <meta name="color-scheme" content="dark" />
</head>
<body class="theme-default">

  <!-- LOGIN -->
  <section id="screen-login" class="screen">
    <div class="login-content">
      <h1 class="glitch" aria-label="MOULTLOOK.COM">MOULTLOOK.COM</h1>
      <div class="login-box">
        <button class="main-btn" onclick="startLoading('en')">
          CHECK MY CRABS<br /><small>(International)</small>
        </button>
        <div class="or-divider">OR</div>
        <button class="french-btn" onclick="startLoading('fr')">
          CRABE M'A TUER<br /><small>(Gascogne Occupée)</small>
        </button>
      </div>
    </div>
  </section>

  <!-- LOADING -->
  <section id="screen-loading" class="screen" style="display:none;">
    <div class="loader-content">
      <div class="crab-spinner" aria-hidden="true">🦀</div>
      <h2 id="loading-title">Hardening...</h2>
      <div class="loader-bar" aria-hidden="true"><span class="loader-bar-fill"></span></div>
      <div class="loader-hint" id="loading-hint" aria-hidden="true"></div>
    </div>
  </section>

  <!-- APP -->
  <section id="screen-app" class="screen" style="display:none;">
    <div class="scrolling-banner" aria-hidden="true">
      <div id="banner-text" class="banner-text"></div>
    </div>

    <div class="app-layout">
      <aside id="sidebar" class="sidebar" aria-label="Primary">
        <div id="sidebar-toggle" class="moult-header" role="button" tabindex="0" aria-label="Toggle sidebar">
          <span class="hamburger" aria-hidden="true">≡</span>
          <span class="label-full">MOULTLOOK</span>
          <span class="label-vert">M O U L T L O O K</span>
        </div>
        <nav class="nav-links" id="sidebar-nav" aria-label="Navigation"></nav>
        <div class="nav-item moult-btn" onclick="moult()" role="button" tabindex="0">
          <span class="icon" aria-hidden="true">🦀</span> <span class="txt">MOULT</span>
        </div>
      </aside>

      <section class="middle-row" id="email-list" aria-label="Message list"></section>
      <main class="content-view" id="content-view" aria-label="Content"></main>
    </div>

    <footer class="mirror-footer">
      <button id="lang-toggle-btn" class="tiny-btn" onclick="toggleLanguage()"></button>
    </footer>
  </section>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
