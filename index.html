<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MOULTLOOK.COM</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Press+Start+2P&family=Special+Elite&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="crt">
    <div class="glitter-bg"></div>

    <section id="screen-login" class="screen">
        <div class="login-hero">
            <h1 class="big-title">MOULTLOOK</h1>
            <div class="btn-container">
                <button class="gba-btn" onclick="startLoading('en')">EN // OPERATE</button>
                <button class="gba-btn" onclick="startLoading('fr')" style="background: var(--cherry);">FR // EVOLUER</button>
            </div>
        </div>
    </section>

    <section id="screen-loading" class="screen" style="display:none;">
        <div class="loading-wrap">
            <div class="loading-crab">🦀</div>
            <h2 id="loading-title" class="big-title" style="font-size: 2rem;">HARDENING...</h2>
            <div id="loading-sub" style="font-family: var(--font-pixel); font-size: 10px; text-align: center;"></div>
        </div>
    </section>

    <section id="screen-app" class="screen" style="display:none;">
        <div class="pokedex-window">
            <div class="title-bar">
                <h1 id="app-win-title">MOULTLOOK v3.0</h1>
                <div class="gba-btn" style="padding: 5px 10px; font-size: 8px;" onclick="moult()">EJECT</div>
            </div>
            <div class="app-grid">
                <aside class="sidebar">
                    <nav id="sidebar-nav"></nav>
                </aside>
                <section class="list-view" id="email-list"></section>
                <main class="content-view" id="content-view"></main>
            </div>
        </div>
    </section>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
